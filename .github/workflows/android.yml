# يبني تطبيق «عافيتي» الأصلي للأندرويد (Kotlin) ويرفع ملف APK للتثبيت المباشر.
# يعمل عند تغيّر native/android/** فقط، ولا يرفع شيئًا إلى Google Play.
name: Android build

on:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # رقم البناء هو رقم تشغيل GitHub
      - name: Unit tests and debug APK
        env:
          AFIATI_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afiati-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
